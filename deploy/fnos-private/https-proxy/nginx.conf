worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
    access_log off;
    error_log /dev/stderr warn;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        ssl_certificate /etc/nginx/tls/nas.crt;
        ssl_certificate_key /etc/nginx/tls/nas.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        client_max_body_size 0;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        location ^~ /nowen-note-device/ {
            # Defining any proxy_set_header here disables the parent header inheritance.
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Cookie "";
            proxy_set_header X-Trim-Userid "";
            proxy_set_header X-Trim-Username "";
            proxy_set_header X-Trim-Isadmin "";
            proxy_pass http://127.0.0.1:3502;
        }
        location / { proxy_pass http://127.0.0.1:80; }
    }
}
