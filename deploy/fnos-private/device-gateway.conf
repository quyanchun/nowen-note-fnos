# Installed separately in fnOS nginx conf.d. Only Nowen device synchronization uses this route.
location ^~ /nowen-note-device/ {
    # This route validates its own revocable device credentials in Nowen, rather than NAS cookies.
    auth_request off;
    access_log off;
    client_max_body_size 128m;
    proxy_pass http://127.0.0.1:3502;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Trim-Userid "";
    proxy_set_header X-Trim-Username "";
    proxy_set_header X-Trim-Isadmin "";
    proxy_set_header Cookie "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_intercept_errors off;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    add_header Cache-Control "no-store" always;
}
