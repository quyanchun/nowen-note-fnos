<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
<title>Nowen 快速搜索</title>
<link rel="stylesheet" href="panel.css">
<form>
  <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.8"/><path d="m16 16 5 5"/></svg>
  <input autofocus role="combobox" aria-autocomplete="list" aria-controls="rows" aria-expanded="false" aria-label="搜索笔记" placeholder="搜索笔记…" maxlength="512" autocomplete="off" spellcheck="false">
  <div class="modes" role="group" aria-label="搜索方式">
    <button type="button" id="search" aria-pressed="true">搜索</button>
    <button type="button" id="ask" aria-pressed="false">问答</button>
  </div>
  <button type="button" id="new" aria-label="新建笔记" title="新建笔记"><svg viewBox="0 0 24 24"><path d="M4 7a2 2 0 0 1 2-2h7m5 7v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2ZM10 14l1-4 7-7 3 3-7 7z"/></svg></button>
</form>
<main>
  <section id="results" aria-label="结果">
    <div id="content">
      <div id="search-view"><p id="search-status" role="status"></p><div id="rows" role="listbox" aria-label="匹配笔记"></div></div>
      <div id="ask-view" hidden>
        <p id="question"></p><p id="ask-status" role="status"></p>
        <h2 id="answer-label" hidden>AI 回答</h2>
        <article id="answer" class="prose" aria-label="回答"></article>
        <section id="sources" aria-labelledby="ref-label" hidden>
          <h2 id="ref-label">引用来源 <span id="ref-count"></span></h2>
          <div id="refs" role="listbox" aria-label="引用来源"></div>
        </section>
      </div>
    </div>
  </section>
  <aside id="side" hidden aria-label="笔记详情">
    <div class="tools"><strong id="side-label">笔记详情</strong><button id="open-app" type="button">在 App 中打开 ↗</button><button id="close-side" type="button" title="收起" aria-label="收起详情">×</button></div>
    <section id="reader" tabindex="0"><h2 id="note-title"></h2><article id="note-body" class="prose"></article><p id="notice" role="status"></p></section>
    <div id="compose" hidden>
      <input id="note-name" aria-label="笔记标题" placeholder="标题（可选）" maxlength="200">
      <textarea id="note-text" aria-label="笔记正文" placeholder="写下笔记…" maxlength="60000"></textarea>
      <div class="compose-footer"><span id="save-status" role="status"></span><button id="organize" type="button" title="按主题选择或新建文件夹">AI 整理并保存</button><button id="save" type="button" title="直接存入收集箱（⌘↵）">保存笔记</button></div>
    </div>
  </aside>
</main>
<script src="panel.js"></script>
</html>
